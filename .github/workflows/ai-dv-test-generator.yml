name: AI DV Test Generator CI

on:
  pull_request:
    paths:
      - "ai-dv-test-generator/**"
      - ".github/workflows/ai-dv-test-generator.yml"
  push:
    branches:
      - main
    paths:
      - "ai-dv-test-generator/**"
      - ".github/workflows/ai-dv-test-generator.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-dv-test-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q
